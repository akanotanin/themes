name: deploy

on:
  push:
    branches: [main]
  # Daily, so a theme's new release reaches the site without a commit here.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A second run during a deploy supersedes it rather than queueing.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: gh release download -R monitor-probe/monitor -p monitor-hub-x86_64-unknown-linux-musl -D "$RUNNER_TEMP" && chmod +x "$RUNNER_TEMP/monitor-hub-x86_64-unknown-linux-musl"
        env:
          GH_TOKEN: ${{ github.token }}
      # Exit status 2 means some themes failed and were left out. The rest are
      # still deployed; the run then fails so the failure is noticed.
      - id: build
        run: |
          set +e
          node scripts/build.mjs "$RUNNER_TEMP/monitor-hub-x86_64-unknown-linux-musl"
          echo "code=$?" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.build.outputs.code == '0' || steps.build.outputs.code == '2'
        run: node scripts/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.build.outputs.code != '0'
        run: |
          echo "::error::build.mjs exited ${{ steps.build.outputs.code }}; see the build step's summary"
          exit 1
